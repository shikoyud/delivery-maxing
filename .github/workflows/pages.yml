name: Deploy client to GitHub Pages
on:
  push:
    branches: [main, sp1/movement-delivery-loop]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /delivery-maxing/
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @dm/client exec playwright install --with-deps chromium
      - run: pnpm e2e            # builds dist with PAGES_BASE and tests that exact build
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: packages/client/e2e-artifacts
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
