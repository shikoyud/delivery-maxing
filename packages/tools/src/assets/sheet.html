<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Building contact sheet</title>
    <!-- Served by sheet.ts (assets:sheet); never part of the client bundle. Shows pack models, so its output is never committed. -->
    <script type="importmap">
      { "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
    </script>
    <style>
      body { margin: 0; background: #d9dde2; font: 12px/1.25 monospace; }
      #sheet { position: relative; }
      .label { position: absolute; padding: 3px 5px; color: #111; background: rgb(255 255 255 / 0.75); pointer-events: none; }
      .label b { font-size: 13px; }
      #legend { position: absolute; right: 8px; bottom: 6px; padding: 4px 6px; background: rgb(255 255 255 / 0.85); }
      .sw { display: inline-block; width: 10px; height: 10px; margin: 0 3px 0 10px; vertical-align: -1px; }
    </style>
  </head>
  <body>
    <div id="sheet"></div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

      const params = new URLSearchParams(location.search);
      const tile = Number(params.get('tile') ?? 300);
      const cols = Number(params.get('cols') ?? 6);
      const category = params.get('category');
      const filter = new RegExp(params.get('filter') ?? '.');
      const BUILDINGS = ['food', 'shop', 'residential', 'office', 'civic', 'leisure', 'industrial', 'service', 'landmark'];

      const catalog = await fetch('/map/catalog.json').then((r) => r.json());
      const cat = (e) => (e.category === 'vehicles' ? 'vehicle' : e.category === 'props' ? 'prop' : e.category);
      const entries = catalog.entries.filter(
        (e) => e.use === 'placed' && e.file && BUILDINGS.includes(cat(e)) && (!category || cat(e) === category) && filter.test(e.id),
      );
      const rows = Math.max(1, Math.ceil(entries.length / cols));
      const W = cols * tile;
      const H = rows * tile;

      const sheet = document.getElementById('sheet');
      sheet.style.width = `${W}px`;
      sheet.style.height = `${H}px`;
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.setScissorTest(true);
      sheet.appendChild(renderer.domElement);

      const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
      const deg = THREE.MathUtils.degToRad;
      // front axis -> unit vector the front faces
      const FRONT = { '+z': [0, 1], '-z': [0, -1], '+x': [1, 0], '-x': [-1, 0] };

      const scenes = [];
      for (const [i, e] of entries.entries()) {
        const front = FRONT[e.front ?? '+z'];
        const side = [-front[1], front[0]]; // 90 degrees to the right of the front
        const px = e.pivot?.x ?? 0;
        const pz = e.pivot?.z ?? 0;
        const { w, h, d } = e.size;
        const gltf = await loader.loadAsync(`/packs/${e.file.split('/').map(encodeURIComponent).join('/')}`);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(i % 2 ? 0xeef0f3 : 0xe4e7eb);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2));
        const sun = new THREE.DirectionalLight(0xffffff, 1.6);
        sun.position.set(3, 6, 4);
        scene.add(sun, gltf.scene);
        const arrowLen = Math.max(1, Math.min(5, Math.max(w, d) * 0.3));
        const arrow = new THREE.ArrowHelper(
          new THREE.Vector3(front[0], 0, front[1]),
          new THREE.Vector3(px + front[0] * (Math.abs(front[0]) ? w : d) / 2, 0.05, pz + front[1] * (Math.abs(front[0]) ? w : d) / 2),
          arrowLen, 0x1060ff, arrowLen * 0.35, arrowLen * 0.2,
        );
        arrow.traverse((o) => {
          if (o.material) o.material.depthTest = false;
          o.renderOrder = 3;
        });
        const g = Math.max(w, d) + 2;
        scene.add(arrow, new THREE.GridHelper(g, Math.ceil(g), 0x888888, 0xaaaaaa));
        const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 1000);
        const r = 0.5 * Math.hypot(w, h, d);
        // from the front, a little to the right, from above
        const dir = new THREE.Vector3(front[0] * 1.2 + side[0] * 0.6, 0.55, front[1] * 1.2 + side[1] * 0.6).normalize();
        const target = new THREE.Vector3(px, h / 2, pz);
        cam.position.copy(target).addScaledVector(dir, (r / Math.sin(deg(15))) * 1.02);
        cam.lookAt(target);
        scenes.push({ scene, cam, i });
        const el = document.createElement('div');
        el.className = 'label';
        el.style.left = `${(i % cols) * tile}px`;
        el.style.top = `${Math.floor(i / cols) * tile}px`;
        el.innerHTML = `<b>${e.id}</b><br>${w.toFixed(1)}x${h.toFixed(1)}x${d.toFixed(1)} m front ${e.front ?? '+z'}`;
        sheet.appendChild(el);
      }
      const legend = document.createElement('div');
      legend.id = 'legend';
      legend.innerHTML = `<span class="sw" style="background:#1060ff"></span>front (street side) - ${category ?? 'all buildings'}`;
      sheet.appendChild(legend);

      for (const { scene, cam, i } of scenes) {
        const x = (i % cols) * tile;
        const y = H - (Math.floor(i / cols) + 1) * tile;
        renderer.setViewport(x, y, tile, tile);
        renderer.setScissor(x, y, tile, tile);
        renderer.render(scene, cam);
      }
      window.sheetReady = { w: W, h: H, count: entries.length };
    </script>
  </body>
</html>
